name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [fasta_extractor_v2, parsimony_engine, aggregation_engine, fasta_export, lake_stats, shared_peptide_classifier]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-15
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/${{ matrix.crate }}/Cargo.toml --all --check
      - run: cargo clippy --locked --manifest-path rust/${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path rust/${{ matrix.crate }}/Cargo.toml
      - run: cargo build --release --locked --manifest-path rust/${{ matrix.crate }}/Cargo.toml
  cargo-deny:
    # rust/deny.toml promises this check; every crate is standalone, so it runs per crate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-15
        with:
          toolchain: 1.91.1
      - name: Install cargo-deny 0.20.2 (release tarball, checksum verified)
        run: |
          curl -sSL -o cargo-deny.tgz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tgz" | sha256sum -c -
          tar xzf cargo-deny.tgz --strip-components=1 --wildcards '*/cargo-deny'
          install -m 755 cargo-deny "$HOME/.cargo/bin/cargo-deny"
      - name: cargo deny check, every crate, no warnings tolerated
        run: |
          status=0
          for crate in fasta_extractor_v2 parsimony_engine aggregation_engine fasta_export lake_stats shared_peptide_classifier; do
            echo "== $crate"
            cargo deny --manifest-path "rust/$crate/Cargo.toml" --config rust/deny.toml check 2>&1 | tee "deny_$crate.log"
            test "${PIPESTATUS[0]}" -eq 0 || status=1
            grep -q '^warning' "deny_$crate.log" && { echo "warnings are not accepted"; status=1; }
          done
          exit "$status"

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-15
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - run: python -m pip install '.[dev]'
      - name: Audit Python dependencies against known vulnerabilities
        run: |
          # the runner's preinstalled setuptools (79.0.1 on Python 3.10) carries PYSEC-2026-3447; it is a
          # build tool here, not a shipped dependency, so bring it to the fixed release before auditing
          python -m pip install --upgrade 'setuptools>=83.0.0' pip-audit==2.10.1
          python -m pip_audit --progress-spinner off -r requirements/release.txt --no-deps
          python -m pip_audit --progress-spinner off
      - name: Build cross-language fixtures
        run: |
          mkdir ci_bins
          for crate in fasta_extractor_v2 parsimony_engine aggregation_engine fasta_export; do
            cargo build --release --locked --manifest-path rust/$crate/Cargo.toml
          done
          cp rust/fasta_extractor_v2/target/release/fasta_extractor ci_bins/
          cp rust/fasta_extractor_v2/target/release/lake_builder ci_bins/
          cp rust/fasta_extractor_v2/target/release/hash_fasta ci_bins/
          cp rust/parsimony_engine/target/release/parsimony_engine ci_bins/
          cp rust/aggregation_engine/target/release/aggregation_engine ci_bins/
          cp rust/fasta_export/target/release/fasta_export ci_bins/
          echo "FASTALAKE_BIN_DIR=$PWD/ci_bins" >> "$GITHUB_ENV"
      - run: ruff check fasta_lake tests
      - run: python tools/check_no_site_paths.py --selftest
      - run: python tools/check_no_site_paths.py
      - name: Source manifest matches the tree
        # release/SOURCE_MANIFEST.json describes what a release ships, so it is
        # regenerated on the release branch and enforced there and on tags.
        # It is not enforced on other refs: Dependabot edits workflow and lock
        # files without regenerating it, and would fail here by construction.
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || startsWith(github.ref, 'refs/heads/release/')
          || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
        run: python tools/source_manifest.py --check
      - run: python tools/render_reference.py --check
      - run: python -m pytest tests -q -rs
      - name: Check synthetic molecular-evidence example
        run: python examples/molecular/run_example.py --out ci_molecular
      - run: bash demo/run_demo.sh ci_demo
  real-data-example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cohort: [campi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-15
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - run: python examples/${{ matrix.cohort }}/run_example.py --out ci_${{ matrix.cohort }} --threads 2
      - name: Run the examples the tutorial notebooks read
        if: matrix.cohort == 'campi'
        run: |
          python -m pip install '.[analysis,directlfq,docs]'
          # the CAMPI example built the Rust executables and unpacked Sage into its runtime
          export FASTALAKE_BIN_DIR="$PWD/ci_campi/_runtime/bin"
          export PATH="$FASTALAKE_BIN_DIR:$PATH"
          mkdir -p tutorial_data && ln -s "$PWD/ci_campi" tutorial_data/campi
          python examples/multiomics/run_example.py --campi tutorial_data/campi --out tutorial_data/multiomics --threads 2
          python examples/community/run_example.py --groups tutorial_data/campi/study --out tutorial_data/community
          python examples/analysis/run_example.py --out tutorial_data/analysis
          python examples/functional/run_example.py --out tutorial_data/functional
      - name: Execute the tutorial notebooks against those outputs
        if: matrix.cohort == 'campi'
        env:
          MPLBACKEND: Agg
        run: python tools/run_tutorials.py --check --data tutorial_data
      - name: Retain example diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: example-${{ matrix.cohort }}-diagnostics
          path: |
            ci_${{ matrix.cohort }}/*.log
            ci_${{ matrix.cohort }}/*.json
          if-no-files-found: ignore
          retention-days: 14

  directlfq:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,directlfq]'
      - run: python -m pytest tests/test_quantification.py tests/test_simplified_study.py -q

  analysis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [3.11, 3.12]
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .[dev,analysis,directlfq]
      - run: python -m pytest tests/test_downstream.py tests/test_exploration.py tests/test_metaproteomics.py tests/test_qc_plots.py tests/test_taxonomy.py -q
