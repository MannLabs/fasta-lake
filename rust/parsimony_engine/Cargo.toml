[package]
name = "parsimony_engine"
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Peter Treit", "AlphaForge"]
description = "High-performance parsimony inference for metaproteomics: razor, species_budget, uniform"

[dependencies]
aho-corasick = "1.1"
rayon = "1.10"
dashmap = "6.1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
