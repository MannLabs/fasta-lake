[package]
name = "shared_peptide_classifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Peter Treit"]
description = "Lift k-mer-rescued peptides from cluster representatives back to unclustered members (FastaLake v5.4)"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
ahash = "0.8"
memchr = "2.7"

[[bin]]
name = "shared_peptide_classifier"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
