[package]
name = "aggregation_engine"
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Peter Treit", "AlphaForge"]
description = "High-performance SAGE output aggregation for metaproteomics"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.3"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
indexmap = "2"

[profile.release]
opt-level = 3
lto = true
