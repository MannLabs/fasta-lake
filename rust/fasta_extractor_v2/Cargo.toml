[package]
name = "fasta_extractor"
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["AlphaForge"]
description = "High-performance parallel peptide-to-protein matching with full sequence extraction"

[dependencies]
# Latest Aho-Corasick for multi-pattern matching
aho-corasick = "1.1"

# Latest rayon for data parallelism
rayon = "1.10"

# Memory-mapped I/O for huge files
memmap2 = "0.9.11"

# Fast parallel hashmap
dashmap = "6.1"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Progress bars
indicatif = { version = "0.18.6", features = ["rayon"] }

# CSV parsing for AlphaNovo results
csv = "1.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parallel file writing
parking_lot = "0.12"

# Crossbeam for channels
crossbeam-channel = "0.5"

# SHA256 hashing for sequence deduplication.
# Contract (normalization + algorithm) is shared with Python — see
# fasta_lake/hashing.py. Byte-for-byte equality is enforced by
# tests/test_hashing_crosslang.py.
sha2 = "0.11"

# Glob pattern matching for file discovery
glob = "0.3"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 4
